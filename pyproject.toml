[project]
name = "ws"
version = "0.1.0"
description = "Personal workspace CLI: confidentiality guardrails, project scaffolding and git helpers."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ws = "ws.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv]
# claude plugin eval refuses a plugin holding a file with more than one name, and every worktree
# of the repo lives inside it (.claude/worktrees): their .venv must hold copies, not hard links.
link-mode = "copy"

[tool.ruff]
line-length = 100
extend-exclude = ["projects"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

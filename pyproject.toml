[project]
name = "ws"
version = "0.1.0"
description = "Personal workspace CLI: confidentiality guardrails, project scaffolding and git helpers."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ws = "ws.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

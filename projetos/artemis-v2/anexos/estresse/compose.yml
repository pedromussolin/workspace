name: estresse
services:
  db:
    image: postgres:13.10
    environment: {POSTGRES_USER: teste, POSTGRES_PASSWORD: teste, POSTGRES_DB: platform-cessao}
    command: ["postgres", "-c", "shared_buffers=1GB", "-c", "max_connections=300", "-c", "work_mem=32MB", "-c", "synchronous_commit=on"]
    shm_size: 1g
  redis:
    image: redis:6.2-alpine
  rabbit:
    image: bitnamilegacy/rabbitmq:3.7.17
    environment: {RABBITMQ_USERNAME: admin, RABBITMQ_PASSWORD: admin, RABBITMQ_VHOST: /cessao}
  worker:
    image: platform-cessao_devcontainer-web:latest
    entrypoint: ["sh", "-c"]
    command:
      - >-
        cp -r /ww /tmp/ww && pip install -q --no-deps --user /tmp/ww >/dev/null 2>&1;
        cd /app && exec python -m celery -A cessao.app.celery worker -Q fake_batch_closing_celery
        --concurrency=$${CONCURRENCY:-2} --without-heartbeat --without-gossip --without-mingle --loglevel=INFO
    environment: &appenv
      ENV: docker
      DD_TRACE_ENABLED: "false"
      PYTHONPATH: /app
      CONCURRENCY: ${CONCURRENCY:-2}
      DB_POSTGRESQL_PLATFORM_CESSAO: postgresql://teste:teste@db:5432/platform-cessao
      CACHE_REDIS_PLATFORM_CESSAO: redis://redis:6379
      RABBITMQ_CESSAO_AMQP: amqp://admin:admin@rabbit:5672//cessao
      FAKE_BATCH_CLOSING_LOCK_TIMEOUT_MS: ${LOCK_TIMEOUT_MS:-60000}
      FAKE_BATCH_CLOSING_STATEMENT_TIMEOUT_MS: ${STATEMENT_TIMEOUT_MS:-480000}
    volumes: ["${CODE_DIR}:/app:ro", "${WW_DIR}:/ww:ro"]
    stop_grace_period: 10s
    mem_limit: 3g
  driver:
    image: platform-cessao_devcontainer-web:latest
    entrypoint: ["sh", "-c"]
    command: ["sleep infinity"]
    environment: *appenv
    volumes: ["${CODE_DIR}:/app:ro", "${WW_DIR}:/ww:ro", "./:/estresse"]
